# Keep the existing pilot login and its password; all business endpoints use Gamexid.Api.
location = /api/access/login {
    proxy_pass http://127.0.0.1:5098;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4k;
}
location = /api/access/logout {
    proxy_pass http://127.0.0.1:5098;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4k;
}
location = /api/documents/extract {
    proxy_pass http://127.0.0.1:5099;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 65s;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5099;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 35s;
}
